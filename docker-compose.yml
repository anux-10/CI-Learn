services:
  paymentservice:
    build:
      context: .
      dockerfile: PaymentServiceApi/Dockerfile
    container_name: paymentservice
    ports:
      - "5093:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Data Source=/data/payments.db
    volumes:
      - payment-data:/data
    restart: unless-stopped
    networks:
      - app-network

  orderservice:
    build:
      context: .
      dockerfile: OrderServiceApi/Dockerfile
    container_name: orderservice
    ports:
      - "5211:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Data Source=/data/app.db
      - PaymentService__BaseUrl=http://paymentservice:8080
    volumes:
      - order-data:/data
    depends_on:
      - paymentservice
    restart: unless-stopped
    networks:
      - app-network

volumes:
  payment-data:
  order-data:

networks:
  app-network:
    driver: bridge
